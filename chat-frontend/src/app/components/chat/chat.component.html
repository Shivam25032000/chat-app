<div class="chat-layout">
  <mat-toolbar color="primary" class="chat-header">
    <span>Chat App</span>
    <span class="spacer"></span>
    <span class="user-info">Logged in as: <strong>{{ currentUser }}</strong></span>
    <button mat-icon-button (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <div class="chat-body">
    <mat-card class="recipient-card">
      <mat-form-field appearance="outline" class="recipient-input">
        <mat-label>Chat with</mat-label>
        <input matInput [formControl]="recipientControl" [matAutocomplete]="auto" placeholder="Select user">
        <mat-icon matSuffix>person_search</mat-icon>
      </mat-form-field>
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option *ngFor="let user of filteredUsers | async" [value]="user.username">
          {{ user.username }}
        </mat-option>
      </mat-autocomplete>
    </mat-card>

    <div class="messages-container" #scrollMe>
      <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="{'sent': msg.senderId === currentUser, 'received': msg.senderId !== currentUser}">
        <div class="message-bubble">
          <div class="message-content">{{ msg.content }}</div>
          <div class="message-time">{{ msg.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
      <div *ngIf="messages.length === 0" class="empty-state">
        <mat-icon>chat_bubble_outline</mat-icon>
        <p>No messages yet. Start chatting!</p>
      </div>
    </div>

    <div class="input-area">
      <mat-form-field appearance="outline" class="message-input">
        <input matInput [(ngModel)]="inputMessage" (keyup.enter)="sendMessage()" placeholder="Type a message...">
      </mat-form-field>
      <button mat-fab color="primary" (click)="sendMessage()" [disabled]="!recipientId">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
</div>
