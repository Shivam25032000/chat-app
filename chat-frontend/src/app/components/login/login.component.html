<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isRegister ? 'Create Account' : 'Welcome Back' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="username" name="username" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width" *ngIf="isRegister">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="submit()" class="full-width">
        {{ isRegister ? 'Register' : 'Login' }}
      </button>
      <button mat-button color="accent" (click)="toggleMode()" class="full-width toggle-btn">
        {{ isRegister ? 'Already have an account? Login' : 'Need an account? Register' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
